<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Neon Run</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05091a;color:white;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;font-weight:800;text-shadow:0 2px 8px #000}#menu{position:absolute;inset:0;display:grid;place-items:center;background:#05091aaa;text-align:center}#panel{padding:24px;max-width:340px}h1{font-size:44px;letter-spacing:3px;color:#45eaff;text-shadow:0 0 24px #00d9ff}button{background:#00d8ff;border:0;color:#041124;padding:14px 38px;border-radius:30px;font-size:20px;font-weight:900}small{display:block;margin:20px 0;line-height:1.7;color:#c9d4ee}</style></head><body><canvas id="game"></canvas><div id="hud"><span id="score">SCORE 0</span><span id="coins">◆ 0</span></div><div id="menu"><div id="panel"><h1>NEON RUN</h1><p id="result">Dodge. Jump. Slide. Survive.</p><small>Swipe left/right to switch lanes<br>Swipe up to jump · down to slide<br>Keyboard: arrows / WASD</small><button id="start">RUN</button><p id="best"></p></div></div><script>
(()=>{'use strict';const c=document.getElementById('game'),x=c.getContext('2d'),menu=document.getElementById('menu'),scoreEl=document.getElementById('score'),coinsEl=document.getElementById('coins'),bestEl=document.getElementById('best');let W=0,H=0,dpr=1,lane=1,items=[],running=false,score=0,coins=0,speed=0,last=0,spawn=0,jump=0,slide=0,clock=0;let best=Number(localStorage.getItem('neonRunBest')||0);function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function start(){lane=1;items=[];running=true;score=0;coins=0;speed=.42;spawn=0;jump=0;slide=0;clock=0;menu.style.display='none';last=performance.now()}document.getElementById('start').onclick=start;function act(a){if(!running)return;if(a==='left')lane=Math.max(0,lane-1);if(a==='right')lane=Math.min(2,lane+1);if(a==='up'&&jump<=0)jump=.7;if(a==='down'&&slide<=0)slide=.7}addEventListener('keydown',e=>{const map={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'up',ArrowDown:'down',s:'down'};if(map[e.key]){e.preventDefault();act(map[e.key])}});let sx=0,sy=0;c.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});c.addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>22)act(dx<0?'left':'right');else if(Math.abs(dy)>22)act(dy<0?'up':'down')});function project(l,z){const p=1-z;return{x:W/2+(l-1)*W*(.07+.24*p),y:H*.29+p*H*.64,s:Math.max(.08,p)}}function polygon(pts,color){x.fillStyle=color;x.beginPath();pts.forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b));x.closePath();x.fill()}function draw(){x.fillStyle='#060b20';x.fillRect(0,0,W,H);const horizon=H*.29;const glow=x.createLinearGradient(0,horizon,0,H);glow.addColorStop(0,'#152346');glow.addColorStop(1,'#060b20');polygon([[W*.43,horizon],[W*.57,horizon],[W*1.1,H],[-W*.1,H]],glow);x.strokeStyle='#24e5ff66';x.lineWidth=2;for(let l=0;l<4;l++){let xx=l-1.5;x.beginPath();x.moveTo(W/2+xx*W*.045,horizon);x.lineTo(W/2+xx*W*.31,H);x.stroke()}for(let i=0;i<13;i++){let z=((i/13+clock*.24)%1),p=project(1,z);x.strokeStyle='#23d7fc44';x.beginPath();x.moveTo(W/2-W*.62*p.s,p.y);x.lineTo(W/2+W*.62*p.s,p.y);x.stroke()}for(const o of items){const p=project(o.l,o.z),s=35*p.s;if(o.type==='coin'){x.fillStyle='#ffd852';x.shadowColor='#ffe100';x.shadowBlur=15;x.beginPath();x.arc(p.x,p.y-s*1.5,s*.4,0,7);x.fill();x.shadowBlur=0}else{let color=o.type==='wall'?'#ff397d':'#ad5cff';x.fillStyle=color;x.shadowColor=color;x.shadowBlur=14;x.fillRect(p.x-s*.65,p.y-s*(o.type==='wall'?2:1),s*1.3,s*(o.type==='wall'?2:1));x.shadowBlur=0}}const p=project(lane,0),j=jump>0?Math.sin((.7-jump)/.7*Math.PI)*H*.13:0;const ph=slide>0?24:49;x.fillStyle='#56faff';x.shadowColor='#00eaff';x.shadowBlur=22;x.fillRect(p.x-16,p.y-ph-j,32,ph);x.shadowBlur=0;x.fillStyle='#ffffff';x.fillRect(p.x-10,p.y-ph-j+8,20,5)}function end(){running=false;best=Math.max(best,Math.floor(score));localStorage.setItem('neonRunBest',String(best));bestEl.textContent='BEST '+best;document.getElementById('result').textContent='Game over · Score '+Math.floor(score)+' · Crystals '+coins;document.getElementById('start').textContent='RETRY';menu.style.display='grid'}function frame(t){const dt=Math.min((t-last)/1000||0,.05);last=t;if(running){clock+=dt;speed=Math.min(.85,.42+score/1800);score+=dt*12;jump=Math.max(0,jump-dt);slide=Math.max(0,slide-dt);spawn-=dt;if(spawn<=0){spawn=Math.max(.45,1.05-score/2200);items.push({l:Math.floor(Math.random()*3),z:1,type:Math.random()<.42?'coin':Math.random()<.5?'wall':'low'})}for(const o of items){o.z-=dt*speed;if(!o.hit&&o.z<.085&&o.z>-.045&&o.l===lane){o.hit=true;if(o.type==='coin'){coins++;score+=10}else if(o.type==='wall'&&jump<=.08||o.type==='low'&&slide<=.08)end()}}items=items.filter(o=>o.z>-.1);scoreEl.textContent='SCORE '+Math.floor(score);coinsEl.textContent='◆ '+coins}draw();requestAnimationFrame(frame)}bestEl.textContent='BEST '+best;requestAnimationFrame(frame)})();
</script></body></html>
